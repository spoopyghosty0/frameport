# Log signature -> diagnosis -> suggested fix. Matched against the game's launch.log (Lepton logcat mirror).
# `pattern` is a Python regex (case-sensitive). `suggest` lists patch ids (+ optional params) the UI offers as
# "apply and rebuild". `severity`: fatal (the game can't run) | error | warning | info.
# Sources: every failure we hit porting 34 games to the Steam Frame (see docs/PLAYBOOK.md).
signatures:
  - id: no-launcher
    pattern: 'APP_ACTIVITY is empty'
    severity: fatal
    diagnosis: Lepton found no activity with category LAUNCHER.
    suggest: [frame.launcher]
  - id: no-arm64
    pattern: 'INSTALL_FAILED_NO_MATCHING_ABIS'
    severity: fatal
    diagnosis: 32-bit-only APK. The Steam Frame has no AArch32; this cannot run. Use the PC (Rift) version via Revive.
    suggest: []
  - id: unity-render-crash
    pattern: 'CRASH\s*:.*#\d+\s+pc [0-9a-f]+\s+\S*libgallium_dri\.so'
    severity: fatal
    diagnosis: Unity's render thread crashed inside the Frame's GL driver (Mesa/Zink); the picture freezes or stays grey. Known triggers - an OVROverlay copy (try "Unity - skip OVROverlay layers", e.g. The Room VR), MSAA switched on at runtime, a GPU hang (zink DEVICE LOST).
    suggest: [frame.unity_no_overlay_copy, frame.unity_runtime_msaa_off]
  - id: swapchain-rect-invalid
    pattern: 'xrEndFrame failed -25\b'
    severity: fatal
    diagnosis: The runtime rejects the game's frames because an image rect reaches past its swapchain (by a few pixels on some Frames); the game stops drawing (e.g. stuck at a "Waiting" box). FrameBridge from FramePort 0.11.0 clamps the rects - rebuild and reinstall the game.
    suggest: [frame.adapter]
  - id: missing-ovr-symbol
    pattern: '(UnsatisfiedLinkError|cannot locate symbol) .*"?(ovr_[A-Za-z0-9_]+|ovrMessageType_ToString)'
    severity: fatal
    diagnosis: The game imports Meta platform functions overport's loader lacks.
    suggest: [frame.ovrstubs, frame.ovrplatformcompat]
  - id: oculus-os-class
    pattern: '(ClassNotFoundException|NoClassDefFoundError).*com[./]oculus[./]os[./](AnalyticsEvent|UnifiedTelemetryLogger)'
    severity: fatal
    diagnosis: Quest-only telemetry class lookup aborts the app (Meta XR Audio / native telemetry).
    suggest: [frame.metaxr_telemetry, frame.oculusos]
  - id: checkjni-abort
    pattern: 'JNI DETECTED ERROR IN APPLICATION|GetStringUTFChars.*NULL|CheckJNI'
    severity: fatal
    diagnosis: CheckJNI (on because the app is debuggable) aborts on sloppy JNI usage.
    suggest: [frame.nodebug]
  - id: force-quit
    pattern: 'System\.exit|ForceQuit|FAndroidMisc::RequestExit'
    severity: error
    diagnosis: The game quit itself right after starting (Unreal ForceQuit after a failed platform check).
    suggest: [patch_remove_unreal_force_quit]
    use_alt: true
  - id: swapchain-format
    pattern: 'xrCreateSwapchain.*(-26|FORMAT_UNSUPPORTED)|swapchain format .* rejected'
    unless: 'FrameBridge:\s+retry (samples=1|format=\d+) result=0'  # the adapter's fallback worked
    severity: error
    diagnosis: The Frame rejected the swapchain format (GLES games must use sRGB formats, no MSAA).
    suggest: [adapter.swapchain_fix]
  - id: zink-device-lost
    pattern: 'zink.*DEVICE[_ ]LOST|VK_ERROR_DEVICE_LOST'
    severity: fatal
    diagnosis: The GPU hung (Zink/Mesa). For GLES Unity games MSAA render-to-texture is the usual cause.
    suggest: [frame.unity_no_msaa, frame.unity_runtime_msaa_off]
  - id: unity-runtime-msaa
    pattern: 'recommended MSAA level is [248]\. Switching to the recommended level'
    severity: info
    diagnosis: The game's OVRManager turns MSAA on at runtime (QualitySettings can't keep it off). On GLES this can
      hang the Frame's GPU or restart the headset; if it does, keep it off in the game's code.
    suggest: [frame.unity_runtime_msaa_off]
  - id: runtime-input-crash
    pattern: 'vrclient\.so[^\n]*(UpdateActionStateInternal|sxr_xrSyncActions)'
    severity: fatal
    diagnosis: The Frame's runtime crashed in its controller-input code (xrSyncActions), typically right after the game
      got focus. sync_guard serialises input syncs and pauses them briefly after focus returns.
    suggest: [adapter.sync_guard]
  - id: focus-dip-teleport
    pattern: 'OnVRPresence[^\n]*Teleport'
    severity: warning
    diagnosis: The game moves the player when the headset reports presence again, which the Frame's brief focus dips
      trigger (the view jumps). focus_hold hides dips under 600 ms.
    suggest: [adapter.focus_hold]
  - id: unity-vr-device-none
    pattern: 'NewtonVR.*(not setup properly|no headset found)|Loaded VR device: None|XR: Oculus could not be loaded'
    severity: fatal
    diagnosis: Unity didn't start its Oculus VR device (older Unity checks for Meta's system apps first), so the game
      runs as a hidden 2D app.
    suggest: [frame.unity_oculus_check]
  - id: sdl-no-clipboard
    pattern: 'ClipboardManager\.addPrimaryClipChangedListener|SDLClipboardHandler\.<init>'
    severity: fatal
    diagnosis: An SDL app (SDL2 / LÖVE) crashed at start because Lepton's Android has no clipboard service.
    suggest: [frame.sdl_clipboard]
  - id: controller-profile-rejected
    pattern: 'PATH_UNSUPPORTED.*xrSuggestInteractionProfileBindings|xrSuggestInteractionProfileBindings.*(-48|PATH_UNSUPPORTED)'
    severity: info
    diagnosis: The runtime rejected controller bindings for a profile it doesn't know (Meta's Touch Plus/Pro). Usually
      harmless (Meta's OVRPlugin suggests plain Touch too); a game that suggests only these gets them again as Touch
      (profile_remap, on by default; log "controller profile ... -> oculus/touch_controller").
    suggest: []
  - id: input-call-failed
    pattern: 'input_diag: unsupported: (xrStringToPath|xrCreateAction|xrAttachSessionActionSets|xrSyncActions) ->'
    severity: warning
    diagnosis: The runtime refused one of the game's controller-input calls (logged by input_diag; the line names the
      call, the result and the argument), so controls set up through it don't work.
    suggest: []
  - id: gl-shader-failed
    pattern: 'GLShim\s*: SHADER COMPILE FAILED|#extension directive is not allowed in the middle|could not implicitly convert operands'
    severity: error
    diagnosis: Shaders written for Quest drivers fail on Mesa (GLSL strictness).
    suggest: [frame.gl_shim]
  - id: vrapi-unsupported-layer
    pattern: 'OVRPortVrApi.*Unsupported VrApi layer type (\d+)'
    severity: error
    diagnosis: The game submits a VrApi layer type the bridge can't show; whole frames are dropped (black screen).
    suggest: []
  - id: direct-vrapi
    pattern: 'vrapi_Initialize|VrApi.*not supported|libvrapi\.so.*(not found|failed)'
    severity: warning
    diagnosis: The engine talks to VrApi directly; it needs the VrApi bridge.
    suggest: [frame.vrapi_bridge]
  - id: passthrough-missing
    pattern: 'XR_FB_passthrough.*(not supported|UNSUPPORTED|missing)|XR_ERROR_EXTENSION_NOT_PRESENT.*passthrough'
    severity: error
    diagnosis: The game needs Meta passthrough; the adapter emulates it.
    suggest: [adapter.passthrough_emul, patch_force_passthrough]
  - id: render-model-requested
    pattern: 'dropped unsupported extension XR_FB_render_model'
    severity: info
    diagnosis: The game asks the headset for its controller models (XR_FB_render_model), which the Frame lacks, so it
      shows its own (Quest) controllers or none. The adapter can serve the Steam Frame controllers instead.
    suggest: [adapter.controller_models]
  - id: controller-models-missing
    pattern: 'FrameBridge: controller models not found'
    severity: warning
    diagnosis: Steam Frame controller models are on, but the converted models aren't in the game's files dir (the
      agent found no Frame controller render models in SteamVR at install time; see the install log, or run the
      agent's controller_models command).
    suggest: []
  - id: scene-missing
    # not OVRPlugin's routine "Unavailable OpenXR extension: XR_FB_scene" (printed by every OVRPlugin game)
    pattern: '(?<!Unavailable OpenXR extension: )XR_FB_scene|XR_FB_spatial_entity.*(not supported|UNSUPPORTED)|xrQuerySpacesFB'
    severity: warning
    diagnosis: The game uses the Meta scene (room) API; enable the adapter's guardian-based room emulation.
    suggest: [adapter.scene_emul]
  - id: time-conversion
    pattern: 'xrConvert(Timespec)?Time(ToTimespec)?Time(KHR)?.*(-12|FUNCTION_UNSUPPORTED)'
    severity: warning
    diagnosis: Runtime lacks timespec time conversion (emulated by the current adapter build).
    suggest: [frame.adapter]
  - id: fossilize-renderpass
    pattern: '#0\d pc [^\n]*libVkLayer_fossilize\.so[\s\S]{0,4000}?FVulkanRenderPass::FVulkanRenderPass'
    severity: fatal
    diagnosis: Lepton's Fossilize layer crashed while recording a render pass (the engine leaves an attachment reference's pNext uninitialized).
    suggest: [frame.vk_sanitize]
    supersedes: [native-crash]
  - id: equirect-layers-dropped
    pattern: 'new layer: type=100009100\d [^\n]*usable=0|new layer: type=1000018000 [^\n]*usable=0'
    severity: warning
    diagnosis: The game shows 360° (equirect) layers, e.g. a video player's theatre or 360° videos, which the Frame's
      runtime can't composite, so they are missing. GLES games can get them back as panels around the player.
    suggest: [adapter.equirect_emul]
  - id: equirect-emul-disabled
    pattern: 'equirect_emul: (disabled|drawing failed|not a GLES session)'
    severity: warning
    diagnosis: The 360° layer emulation switched itself off for this session (no shared GLES context, or drawing
      failed); the 360° layers are dropped as without it. See the lines before it in the log.
    suggest: []
  - id: swapchain-size-abort
    pattern: '#01 pc [^\n]*libopenxr_loader\.so \(xrCreateSwapchain\+|Wrong createInfo size'
    severity: fatal
    diagnosis: overport's OpenXR dispatcher aborted on a swapchain larger than 4096 px (video players, big textures).
    suggest: [frame.swapchain_limit]
    supersedes: [native-crash]
  - id: native-crash
    pattern: 'Fatal signal (\d+) \(SIG[A-Z]+\)'
    severity: fatal
    diagnosis: Native crash. See the backtrace (#00 pc ...) for the library.
    suggest: []
  - id: java-crash
    pattern: 'FATAL EXCEPTION'
    severity: fatal
    diagnosis: Java crash. See "Caused by".
    suggest: []
  - id: dlopen-failed
    pattern: 'dlopen failed: (.*)'
    severity: info
    diagnosis: A native library failed to load. Usually an optional probe (libOVRMrcLib, libovraudio32, …); it only
      matters when a crash or UnsatisfiedLinkError abort follows.
    suggest: []
  - id: keyring-quota
    pattern: 'create keyring .*Disk quota exceeded'
    severity: fatal
    diagnosis: The Frame ran out of kernel keys (rootless podman leaks one session keyring per container start). The
      FramePort agent sets keyring=false in ~/.config/containers/containers.conf; reboot the Frame to free the leaked keys.
    suggest: []
  - id: container-not-started
    pattern: "is not a running context|OCI runtime error"
    severity: fatal
    diagnosis: The Lepton container failed to start (see the error above it in launch.log).
    suggest: []
  - id: permission-denied-save
    pattern: 'Permission denied.*(Android/data|/sdcard)|EACCES.*Android/data'
    severity: warning
    diagnosis: The game created folders it can't write (saves break). The FramePort launcher repairs permissions every 2 s.
    suggest: []
  # ---- PC VR (Oculus Rift games under Revive; on the Frame under Proton). kind: pcvr = only for those logs
  - id: proton-missing-runtime
    kind: pcvr
    pattern: 'needs Steam app \d+ \(runtime\)|_v2-entry-point: (No such file|not found)'
    severity: fatal
    diagnosis: The Steam Linux Runtime that Proton needs isn't installed on the Frame.
    suggest: []
  - id: revive-inject-failed
    kind: pcvr
    pattern: 'Failed to create process'
    severity: fatal
    diagnosis: Revive's injector could not start the game (wrong exe path, or a 32-bit/64-bit mismatch).
    suggest: []
  - id: oculus-hmd-event
    kind: pcvr
    pattern: 'FramePort oculushmd: could not (create the OculusHMDConnected event|start the command)'
    severity: error
    diagnosis: FramePort's Oculus detection helper couldn't provide the OculusHMDConnected event (or couldn't start the game). Unreal's Oculus plugin then skips VR silently and the game runs as a flat window.
    suggest: [pcvr.oculus_unreal, pcvr.proton_log]
  - id: openxr-no-runtime
    kind: pcvr
    # (not the loader's 'xrCreateInstance failed': Proton's own OpenXR probe fails once and retries on the Frame)
    pattern: 'XR_ERROR_RUNTIME_(UNAVAILABLE|FAILURE)|No OpenXR runtime|OpenXR runtime (is )?not (found|available)|failed to (create|initialize) (the )?OpenXR'
    severity: fatal
    diagnosis: No OpenXR runtime reached the game. On a PC start SteamVR (or set it as the OpenXR runtime); on the Frame Proton couldn't bridge to the Frame runtime.
    suggest: []
  - id: openxr-missing-ext
    kind: pcvr
    pattern: 'XR_ERROR_EXTENSION_NOT_PRESENT|XR_KHR_D3D11_enable.*(not|unsupported)'
    severity: fatal
    diagnosis: The OpenXR runtime lacks an extension Revive requires (XR_KHR_D3D11_enable / win32 time conversion).
    suggest: [pcvr.xr_timefix, pcvr.revive_openvr]
  - id: openxr-api-version
    kind: pcvr
    pattern: 'LoaderInstance::CreateInstance chained CreateInstance call failed|XR_ERROR_API_VERSION_UNSUPPORTED|Unable to load LibOVRRT DLL'
    severity: fatal
    diagnosis: Proton's VR setup couldn't create an OpenXR instance (the Frame's SteamVR runtime only accepts OpenXR 1.0 apps; Proton asks for 1.1), so the game got no VR — a flat window, or Revive fails with "Unable to load LibOVRRT DLL".
    suggest: [pcvr.xr_timefix]
  - id: openxr-time-conversion
    kind: pcvr
    pattern: 'xrConvert(TimespecTimeToTime|TimeToTimespecTime)KHR failed|XR_KHR_convert_timespec_time not available'
    severity: error
    diagnosis: The OpenXR runtime refused time conversion, which Proton needs for Windows games' performance-counter times.
    suggest: [pcvr.xr_timefix]
  - id: delayload-missing
    kind: pcvr
    pattern: '[Ee]xception:? 0xc06d007e|code=c06d007e'
    severity: fatal
    diagnosis: A DLL the game loads on demand is missing (Windows delay-load error). For Oculus Store games this is usually LibOVRPlatform64_1.dll, the Oculus Platform SDK that the Oculus app installs for the licence check; FramePort doesn't replace it, so such games need the Oculus app (PC mode).
    suggest: []
    supersedes: [unreal-crash, wine-crash]  # the crash is this missing DLL; don't send the user after other fixes
  - id: oculus-entitlement
    kind: pcvr
    pattern: '(?i)entitlement (check )?fail|ovr_PlatformInitialize.*(fail|error)|ovrPlatformInitialize_(NotEntitled|Uninitialized|PreLoaded|FileInvalid|SignatureInvalid|UnableToVerify)'
    severity: fatal
    diagnosis: The Oculus Platform SDK entitlement check failed. The game needs the Oculus app running with a license you own (PC mode only).
    suggest: []
  - id: vcruntime-missing
    kind: pcvr
    pattern: '(?i)(MSVCP|VCRUNTIME)\d+[_\d]*\.dll.*(not found|missing)'
    severity: error
    diagnosis: The game needs a Microsoft Visual C++ runtime. Install the vc_redist that ships with the game (or winetricks vcrun2019 in the prefix).
    suggest: []
  - id: dxvk-device-lost
    kind: pcvr
    pattern: 'DXVK: .*(DEVICE_LOST|Device lost)|VK_ERROR_DEVICE_LOST'
    severity: fatal
    diagnosis: The GPU driver lost the device while running the game (D3D through DXVK on freedreno).
    suggest: [pcvr.proton_log]
  - id: unreal-crash
    kind: pcvr
    pattern: 'CrashReportClient|UE4CC-Windows|UECC-Windows|Fatal error!|Unhandled Exception: EXCEPTION'
    severity: fatal
    diagnosis: The game crashed (Unreal's crash reporter started). See the game log and crash summary in the log. Common causes are that no VR runtime reached the game (Revive off) or a GPU or driver problem under Proton.
    suggest: [pcvr.revive, pcvr.proton_log, pcvr.no_crash_reporter]
  - id: wine-crash
    kind: pcvr
    pattern: 'Unhandled exception: page fault|wine: Unhandled|Backtrace:'
    severity: error
    diagnosis: The game crashed under Wine/Proton (set the Proton debug log and check steam-<appid>.log).
    suggest: [pcvr.proton_log]

  - id: save-folder-permission
    pattern: "(We don't have write permission to|UnauthorizedAccessException: Access to the path \"/(sdcard|storage/emulated/0)/Android/data/)"
    severity: error
    diagnosis: The game can't write to a folder it created in its storage (e.g. SUPERHOT's cloud/data, mode 1700, which
      makes it quit at start). FramePort's launcher (agent 41 or newer) gives such folders owner and group write
      permission before and during every launch; update the game on the Frame (reinstall) to get the new launcher.
    suggest: []
  - id: surface-swapchain-emulated
    pattern: 'surface_emul: emulated Android surface swapchain'
    severity: info
    diagnosis: The game plays a video on a panel through an Android Surface (XR_KHR_android_surface_swapchain), which the
      Frame's runtime refuses; FrameBridge emulates it (surface_emul) and copies each video frame into the panel.
    suggest: []
  - id: surface-swapchain-failed
    pattern: 'surface_emul: (setup failed|upload failed|EGL context failed|Vulkan upload path unavailable)'
    severity: warning
    diagnosis: FrameBridge couldn't emulate an Android video panel (XR_KHR_android_surface_swapchain); the panel stays
      empty, and a game waiting for its intro video may stay black (e.g. I Am Monkey's intro).
    suggest: []
milestones:  # progress markers, in order; the furthest one reached is reported
  - {id: pcvr-launch, kind: pcvr, pattern: 'FramePort: launching|Launched injector with', label: Launcher started}
  - {id: pcvr-oculus-hmd, kind: pcvr, pattern: 'FramePort oculushmd: OculusHMDConnected event ready', label: Oculus headset event provided}
  - {id: pcvr-inject, kind: pcvr, pattern: 'Succesfully injected|Successfully injected', label: Revive injected into the game}
  - {id: pcvr-window, kind: pcvr, pattern: 'Executable name: (?!steam\.exe|CrashReportClient)\S+\.exe|Creating Gamescope surface', label: Game window created}
  - {id: pcvr-openxr, kind: pcvr, pattern: 'wineopenxr: .*[Ss]ession|LibReviveXR|Revive.*OpenXR|xrCreateSession', label: OpenXR reached}
  - {id: pcvr-session, kind: pcvr, pattern: 'xrCreateSession|XR_SESSION_STATE_(READY|SYNCHRONIZED)', label: OpenXR session created}
  - {id: container, pattern: 'Boot complete!', label: Lepton container started}
  - {id: process, pattern: 'Start proc \d+:', label: App process started}
  - {id: adapter, pattern: 'FrameBridge: scale=', label: FrameBridge adapter loaded}
  - {id: instance, pattern: 'xrCreateInstance result=0', label: OpenXR instance created}
  - {id: session, pattern: 'xrCreateSession|session state=1|Created OpenXR session', label: OpenXR session created}
  - {id: frames, pattern: 'FrameBridge: pacing: [0-9.]+ fps', label: Submitting frames}
