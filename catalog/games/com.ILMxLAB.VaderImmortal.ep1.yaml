package: com.ILMxLAB.VaderImmortal.ep1
title: 'Vader Immortal: Episode I'
status: works
notes: 'Plays (owner''s headset test): loading card, grip/trigger, hands and the lightspeed sequence fixed. Thumbs
  follow the touches with frame.unreal_thumb_touch (Klownicle''s engine fix).'
details: Unreal Engine 4 (GLES). Found and verified in gameplay on a Frame by Klownicle (GitHub issue 49); FramePort
  reimplements them as patches that match the game's code exactly and change nothing when it differs. The engine's
  Quest checks (IsRunningOnSantaCruz) answer "not a Quest" on the Frame - the menu waited for a Quest-only shader
  precompile that never starts (frame.unreal_quest_precompile makes the non-Quest branch report 100 %), and the
  game's key map picked the empty Gear VR controls (frame.unreal_quest_keymap keeps the Quest set). Two lightspeed
  shaders, as the Frame's GL driver (Zink) compiles them, read loop counters and accumulators before setting them
  and hang the GPU; a Vulkan layer under Zink inserts the stores that zero them (frame.zink_shader_fix, zink_shader_fix;
  the captured modules are from Lepton 2.8.14 and stop matching if a Frame update changes the driver's output -
  the layer logs that). OVRPlugin asks for poses at its own clock (pose_time_fix). Unreal's Oculus input animates the
  thumbs from near-touch, which the Frame never reports (frame.unreal_thumb_touch reads the touches instead; binding
  the proximity to the touch inputs in FrameBridge didn't reach the game). The Frame's SteamVR runtime
  leaks about 20 MB a second while the game runs (reported to Valve).
