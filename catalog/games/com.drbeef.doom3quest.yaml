package: com.drbeef.doom3quest
title: Doom3Quest
status: works
notes: HUD and PDA show with frame.gl_multiview_fbo (Xandrix1987's headset test, GitHub 77, no frame-rate drop with
  the PDA open). Walking and running can switch when the frame rate drops, which seems to be the game's own behaviour.
details: Doom3Quest compiles every vertex shader for two views (OVR_multiview) and draws its HUD/PDA into single-view
  framebuffers. Mesa (the Frame's GL) rejects that combination as the spec requires and drops the draw, so they
  stayed black; frame.gl_multiview_fbo draws those passes with a single-view copy of the shader. Xandrix1987's framebuffer.cpp
  fix went upstream as a PR to Team-Beef-Studios/Doom3Quest.
tested_version: 1.4.8
engine: Other
xr: OpenXR
frame:
- frame.gl_multiview_fbo
