name: Working recipe
description: 'Share a recipe that works on the Steam Frame (FramePort fills this in: game menu → "Share working recipe…").'
title: "[Working recipe] "
labels: ["working-config"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Once a maintainer accepts the recipe, it becomes built-in for everyone. Please don't share game files
        or links to them.
  - type: input
    id: game
    attributes:
      label: Game
      description: Title and package name (e.g. Lucky's Tale — com.playful.LuckysTale)
    validations:
      required: true
  - type: input
    id: result
    attributes:
      label: Result
      description: works or issues
    validations:
      required: true
  - type: textarea
    id: recipe
    attributes:
      label: Recipe
      description: Filled in by FramePort. Don't edit the package line.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: FramePort and SteamOS versions
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: What you checked in the headset and any known issues
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I played the game in the headset with this recipe.
          required: true
