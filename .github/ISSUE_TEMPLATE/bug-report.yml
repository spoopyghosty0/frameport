name: Problem report
description: 'A game or FramePort doesn''t work (FramePort fills this in: "Report a problem…").'
title: "[Problem] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please attach the **diagnostics zip** FramePort saved: drag it into the "Diagnostics" box below. It holds logs
        and device details with personal data removed, and no game files.
  - type: input
    id: game
    attributes:
      label: Game
      description: Title and package name; leave empty for problems with FramePort itself
  - type: textarea
    id: description
    attributes:
      label: What happens?
      description: What you did, what you expected and what happened
    validations:
      required: true
  - type: textarea
    id: findings
    attributes:
      label: Launch test
      description: Filled in by FramePort
  - type: textarea
    id: recipe
    attributes:
      label: Recipe
      render: yaml
  - type: textarea
    id: environment
    attributes:
      label: Environment
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics
      description: Drag the FramePort-diag-*.zip here (max 25 MB)
    validations:
      required: true
