<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1276" viewBox="0 0 1080 1276" role="img" aria-labelledby="title desc">
<title id="title">Quest Touch buttons on Steam Frame controllers</title>
<desc id="desc">Quest Touch reference and 4 Frame mappings: SteamVR default, Mirror, Quest pair, and One hand. Each Steam Frame controller button is labelled with the Quest Touch button it sends. A dash means it sends nothing. Left Touch buttons are X and Y; right are A and B.</desc>
<rect width="1080" height="1276" rx="16" fill="#0D0E12"/>
<g font-family="DejaVu Sans,Arial,sans-serif">
<text x="20" y="32" fill="#EDEEF2" font-size="24" font-weight="600" text-anchor="start">Controller buttons</text>
<text x="20" y="57" fill="#A7ABB7" font-size="14" font-weight="400" text-anchor="start">Blue: X / A · Orange: Y / B or Menu · —: sends nothing</text>
<g transform="translate(16 72)">
<rect x="0" y="0" width="520" height="380" rx="12" fill="#16181E" stroke="#2A2D37"/>
<text x="20" y="31" fill="#EDEEF2" font-size="20" font-weight="600" text-anchor="start">Quest Touch reference</text>
<text x="20" y="55" fill="#A7ABB7" font-size="13" font-weight="400" text-anchor="start">Two face buttons per hand, plus Menu on the left</text>
<text x="140" y="84" fill="#A7ABB7" font-size="13" font-weight="400" text-anchor="middle">Left</text>
