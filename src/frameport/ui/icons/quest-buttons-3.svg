<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="title desc">
<title id="title">Quest Touch buttons on Steam Frame controllers</title>
<desc id="desc">One hand: All four Quest face buttons on the right controller, printed letter for letter (A, B, X, Y); the left d-pad also moves the left thumbstick; View is Menu. Each Steam Frame controller button is labelled with the Quest Touch button it sends. A dash means it sends nothing. Left Touch buttons are X and Y; right are A and B.</desc>
